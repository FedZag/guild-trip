# Von Hand starten (Actions › Verbindung zu CurseForge pruefen › Run workflow): prueft Schluessel und Spielversion,
# laedt nichts hoch.
name: Verbindung zu CurseForge pruefen

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pruefen
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
          CF_GAME_VERSION: ${{ vars.CF_GAME_VERSION || '1.60.1' }}
          CF_GAME_VERSION_TYPE: ${{ vars.CF_GAME_VERSION_TYPE }}
        run: python3 -I scripts/upload_curseforge.py --check
